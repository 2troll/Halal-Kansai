apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace = "app.halalkansai"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        ndk {
            // El APK traía x86 y x86_64, que solo sirven para emuladores: 33 MB
            // de librerías de ML Kit que ningún teléfono va a ejecutar. Los
            // móviles reales son arm64 (2017 en adelante) y armeabi-v7a los
            // antiguos, que en esta comunidad todavía existen.
            //
            // Para Google Play se sube un AAB y Play reparte la arquitectura
            // que toca a cada aparato; esto es para el APK que se comparte a
            // mano, que es como lo va a instalar la gente de la mezquita.
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
        applicationId "app.halalkansai"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 10000
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // La clave de subida a Google Play vive FUERA del repo (es público): en
    // ~/.claves/halal-kansai/, con copia en el SSD. Sin ella el build de
    // release sale sin firmar en vez de fallar, para que cualquiera pueda
    // compilar el proyecto.
    def keystorePropsFile = file(System.getenv('HALAL_KANSAI_KEYSTORE') ?: "${System.getProperty('user.home')}/.claves/halal-kansai/keystore.properties")
    if (keystorePropsFile.exists()) {
        def keystoreProps = new Properties()
        keystorePropsFile.withInputStream { keystoreProps.load(it) }
        signingConfigs {
            release {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {

    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

// ML Kit trae los modelos de TODOS los alfabetos: chino, devanagari, japonés
// y coreano. Eso disparó el APK de 29 a 87 MB. Esta app lee etiquetas
// japonesas, así que los otros tres sobran — y 58 MB de más en el móvil de
// alguien que lo tiene lleno es motivo de sobra para que desinstale la app.
configurations.configureEach {
    exclude group: 'com.google.mlkit', module: 'text-recognition-chinese'
    exclude group: 'com.google.mlkit', module: 'text-recognition-devanagari'
    exclude group: 'com.google.mlkit', module: 'text-recognition-korean'
    // El modelo japonés tampoco viaja dentro: lo sirve Google Play Services y
    // se descarga la primera vez que se usa (misma estrategia que ya usa el
    // lector de códigos de barras).
    exclude group: 'com.google.mlkit', module: 'text-recognition-japanese'
}

dependencies {
    implementation 'com.google.android.gms:play-services-mlkit-text-recognition-japanese:16.0.1'
}
