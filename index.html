<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#10211d" />
    <meta
      name="description"
      content="Salat times, qibla, halal places and live khutbah translation for the Muslim community in Japan."
    />

    <link rel="manifest" href="manifest.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fuentes SIN bloquear el arranque. Como hoja de estilos normal, el
         navegador no ejecuta la app hasta que responde fonts.googleapis.com:
         sin cobertura (dentro de una mezquita) o con esa conexión lenta, el
         Nothing Phone 3a se quedaba en la pantalla de carga hasta agotar el
         tiempo de espera. Con media="print" se descarga aparte y se aplica si
         llega; si no, se usan las del sistema, que es lo que usa el diseño. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;600&family=Amiri:wght@400;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
