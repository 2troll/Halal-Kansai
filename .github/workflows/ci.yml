name: CI

on:
  # Todas las ramas: el trabajo de este proyecto no vive solo en main, y un CI
  # que solo mira main no avisa de nada hasta que ya es tarde.
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # El typecheck ya va dentro de build (tsc --noEmit && vite build).
